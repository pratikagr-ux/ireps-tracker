name: Daily Auction Autoscan

on:
  schedule:
    # 01:30 UTC = 07:00 IST
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # --max-detail caps catalogue-detail fetches per run so a big backlog
      # (e.g. right after widening detail sync to all active lots) backfills
      # gradually over several days instead of one very long/slow run.
      - run: python autoscan.py --max-detail 800
        env:
          # service_role key -- bypasses RLS, used only here (never in the
          # client bundle). Set as a repo secret (Settings -> Secrets and
          # variables -> Actions) from the Supabase project's Settings -> API
          # page.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python matex_autoscan.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
